spring.application.name=spring-rag

server.contextPath=/app
spring.profiles.active=dev

app.api-base-url=

#token secrets
app.access-token-jwt-secret=

# token expiration in milliseconds
app.access-token-expiration-ms=

#db
spring.datasource.url=jdbc:postgresql://host:port/db
spring.datasource.username=username
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Github OAuth2
spring.security.oauth2.client.registration.github.client-id=
spring.security.oauth2.client.registration.github.client-secret=
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

# GEMINI AI
spring.ai.google.genai.api-key=
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite
spring.ai.google.genai.embedding.api-key=
spring.ai.google.genai.embedding.text.model=text-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768

# PG Vector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=true

# session & cookie
server.servlet.session.cookie.name=
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# App envs
app.frontend-url=
app.cors.allowed-origins=
app.token-encryptor-password=
app.token-encryptor-salt=
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50

# Logging pattern for the console
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

